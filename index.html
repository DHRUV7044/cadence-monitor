<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadence Laboratory Status Monitor. Diagnostics and status feeds.">
    <title>Cadence Status Monitor</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Background Grid -->
    <div class="workstation-bg">
        <div class="grid-overlay"></div>
    </div>

    <!-- Main Container -->
    <div class="container">

        <!-- Top Panel / Header -->
        <header class="panel-header header-workstation">
            <div class="header-logo-section">
                <a href="https://dhruv7044.github.io/" class="btn-back" title="Back to Hub">
                    <i data-lucide="arrow-left"></i>
                </a>
                <div class="brand-text">
                    <h1>Cadence Status</h1>
                    <span class="sub-brand">EDA Diagnostics Monitor</span>
                </div>
            </div>
            
            <div class="header-status-section">
                <div class="status-metric">
                    <span class="metric-lbl">Link Status</span>
                    <div class="status-indicator">
                        <span class="indicator-dot blinking"></span>
                        <span class="indicator-txt font-mono">ACTIVE</span>
                    </div>
            </div>
        </header>

        <!-- Main Status Grid -->
        <main>
            <div id="status-container" class="status-grid">
                <!-- Loaded dynamically via js/main.js -->
                <div class="loading-state">
                    <i data-lucide="loader-2" class="spinner"></i>
                    <p>Polling node status...</p>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="workstation-footer">
            <span class="footer-ts font-mono" id="generated_at">Last Updated : --/--/---- --:--:--</span>
            <span class="copyright">&copy; 2026 Dhruv Shingala. All rights reserved.</span>
        </footer>

    </div>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
    <script src="js/main.js"></script>
</body>
</html>
